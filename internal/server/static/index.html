<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chordpro</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>chordpro</h1>
    <div class="actions">
      <label class="file-button">
        Open…
        <input id="file" type="file" accept=".cho,.chopro,.pro,.crd,.chord,text/plain">
      </label>
      <span id="filename" class="filename">untitled</span>
      <div class="transpose">
        <button id="transpose-down" title="Transpose down">−</button>
        <span id="transpose-val">0</span>
        <button id="transpose-up" title="Transpose up">+</button>
      </div>
      <button id="save" title="Save the source .cho file (⌘S / Ctrl+S)">Save</button>
      <span id="save-status" class="save-status" aria-live="polite"></span>
      <select id="format" title="Download format">
        <option value="pdf">PDF</option>
        <option value="html">HTML</option>
        <option value="text">Text</option>
      </select>
      <button id="download">Download</button>
      <button id="perform" title="Full-screen view with auto-scroll">Perform</button>
    </div>
  </header>
  <main>
    <textarea id="source" spellcheck="false" placeholder="Paste a ChordPro song or click Open…"></textarea>
    <iframe id="preview" title="preview"></iframe>
  </main>
  <div id="perform-view" class="perform-view" hidden>
    <iframe id="perform-frame" title="perform"></iframe>
    <div class="perform-bar">
      <button id="perform-play" title="Play / pause (Space)">Play</button>
      <label class="perform-tempo" title="Scroll speed assumes one line per bar">
        <input id="perform-bpm" type="number" min="20" max="400" step="1" value="100"> BPM
      </label>
      <select id="perform-layout" title="Layout">
        <option value="columns">Columns</option>
        <option value="scroll">Scroll</option>
      </select>
      <div class="perform-font">
        <button id="perform-smaller" title="Smaller text (−)">A−</button>
        <button id="perform-bigger" title="Larger text (+)">A+</button>
      </div>
      <button id="perform-theme" title="Toggle light / dark (D)">Dark</button>
      <button id="perform-exit" title="Exit (Esc)">Exit</button>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
